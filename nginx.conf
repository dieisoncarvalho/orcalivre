server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # ---------- Compressão ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf application/wasm;

    # Brotli (opcional): requer imagem Nginx com ngx_brotli (ex.: fholzer/nginx-brotli).
    # Descomente se usar essa imagem:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

    # ---------- Cabeçalhos de segurança ----------
    include /etc/nginx/snippets/security-headers.conf;

    # ---------- Assets versionados (hash no nome) ----------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache (para pegar novos builds)
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # ---------- Fallback SPA ----------
    location / {
        try_files $uri /index.html;
    }

    # Bloqueia arquivos ocultos
    location ~ /\. {
        deny all;
    }
}
